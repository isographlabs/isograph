name: CI

on: [push, pull_request]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build-json-schema:
    name: Build json schema
    uses: ./.github/workflows/run-cargo-bin-and-ensure-no-changes.yml
    with:
      binary: build_json_schema

  rust:
    name: Rust
    uses: ./.github/workflows/rust.yml

  js:
    name: JavaScript
    uses: ./.github/workflows/js.yml

  build-swc:
    name: Build swc
    uses: ./.github/workflows/build-swc.yml

  build-js-packages:
    name: Build js packages
    needs: [build-swc]
    uses: ./.github/workflows/build-js-packages.yml

  build-website:
    name: Build website
    uses: ./.github/workflows/build-website.yml

  cli-linux-x64:
    uses: ./.github/workflows/build-cli.yml
    with:
      target: x86_64-unknown-linux-gnu
      os: ubuntu-latest
      build-name: isograph
      artifact-name: isograph_cli-linux-x64
      artifact-file: isograph_cli

  cli-linux-arm64:
    uses: ./.github/workflows/build-cli.yml
    with:
      target: aarch64-unknown-linux-gnu
      os: ubuntu-24.04-arm
      build-name: isograph
      artifact-name: isograph_cli-bin-linux-arm64
      artifact-file: isograph_cli

  cli-macos-x64:
    uses: ./.github/workflows/build-cli.yml
    with:
      target: x86_64-apple-darwin
      os: macos-15-intel
      build-name: isograph
      artifact-name: isograph_cli-macos-x64
      artifact-file: isograph_cli

  cli-macos-arm64:
    uses: ./.github/workflows/build-cli.yml
    with:
      target: aarch64-apple-darwin
      os: macos-latest
      build-name: isograph
      artifact-name: isograph_cli-macos-arm64
      artifact-file: isograph_cli

  cli-win-x64:
    uses: ./.github/workflows/build-cli.yml
    with:
      target: x86_64-pc-windows-msvc
      os: windows-latest
      build-name: isograph.exe
      artifact-name: isograph_cli-bin-win-x64
      artifact-file: isograph_cli.exe
      longpaths: true

  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      [
        build-js-packages,
        build-json-schema,
        build-website,
        rust,
        js,
        build-swc,
        cli-linux-x64,
        cli-linux-arm64,
        cli-macos-x64,
        cli-macos-arm64,
        cli-win-x64,
      ]
    steps:
      - name: Do nothing
        run: echo Isograph is awesome!

  deploy-website:
    name: Deploy website
    needs: [all-checks-passed, build-website]
    if: github.event_name == 'push' && github.repository == 'isographlabs/isograph' && github.ref == 'refs/heads/main' || github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/deploy-website.yml

  main-release:
    name: Main NPM release
    if: >-
      github.event_name == 'push' &&
      github.repository == 'isographlabs/isograph' &&
      (
        (github.ref == 'refs/heads/main' &&
        github.ref_type != 'tag') ||
        startsWith(github.ref, 'refs/heads/deploy/')
      )
    needs:
      [
        all-checks-passed,
        cli-linux-x64,
        cli-linux-arm64,
        cli-macos-x64,
        cli-macos-arm64,
        cli-win-x64,
      ]
    uses: ./.github/workflows/npm-release.yml
    with:
      kind: main
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  versioned-release:
    name: Versioned NPM release
    if: github.event_name == 'push' && github.repository == 'isographlabs/isograph' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      [
        all-checks-passed,
        cli-linux-x64,
        cli-linux-arm64,
        cli-macos-x64,
        cli-macos-arm64,
        cli-win-x64,
      ]
    uses: ./.github/workflows/npm-release.yml
    with:
      kind: versioned
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-isograph-extension:
    name: Publish Isograph Extension
    if: github.event_name == 'push' && github.repository == 'isographlabs/isograph' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/publish-isograph-extension.yml
    needs: [all-checks-passed]
    secrets:
      vs-marketplace-token: ${{ secrets.VS_MARKETPLACE_TOKEN }}
      open-vsx-token: ${{ secrets.OPEN_VSX_TOKEN }}
