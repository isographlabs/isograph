name: Rust

on:
  workflow_call:

jobs:
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Run cargo fmt --check
        run: ./scripts/check-rustfmt.sh

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-clippy-cli:
    name: cargo clippy isograph_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --manifest-path crates/ts_graphql_react_isograph_cli/Cargo.toml --all-targets -- -D warnings

  cargo-test:
    name: Run cargo test (excluding relay tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Run cargo test
        run: cargo test

  swc-plugin:
    name: SWC plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip1
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-js
      - name: Run cargo fmt --check
        run: cargo fmt --manifest-path crates/swc_isograph_plugin/Cargo.toml -- --check
      - name: Run cargo clippy
        run: cargo clippy --manifest-path crates/swc_isograph_plugin/Cargo.toml --all-targets -- -D warnings
      - name: Run cargo test
        run: cargo test --manifest-path crates/swc_isograph_plugin/Cargo.toml
      - name: Build the wasm plugin
        run: pnpm --filter @isograph/plugin-swc build
      - name: Test the wasm plugin under @swc/core
        run: pnpm --filter @isograph/plugin-swc test
