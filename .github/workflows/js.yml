name: JavaScript

on:
  workflow_call:

jobs:
  prettier:
    name: Run prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Run prettier
        run: pnpm run format-prettier
      - name: Check working directory status
        run: ./scripts/check-git-status.sh

  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Run lint
        run: pnpm run lint --deny-warnings

  babel-plugin:
    name: Babel plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Typecheck
        run: pnpm --filter @isograph/babel-plugin typecheck
      - name: Typecheck the runtime
        run: pnpm --filter @isograph/runtime tsc
      - name: Build the runtime
        run: pnpm --filter @isograph/runtime compile-libs
      - name: Test the runtime
        run: pnpm --filter @isograph/runtime test
      - name: Typecheck the pet demo
        run: pnpm --filter pet-demo typecheck
      - name: Test
        run: pnpm --filter @isograph/babel-plugin test
