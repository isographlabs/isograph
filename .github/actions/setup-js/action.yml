name: Setup JS
description: Configure pnpm and Node, then install workspace dependencies.

inputs:
  install-args:
    description: Arguments passed to pnpm install
    required: false
    default: --frozen-lockfile --ignore-scripts

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        registry-url: https://registry.npmjs.org/
    - name: Install dependencies
      run: pnpm install ${{ inputs.install-args }}
      shell: bash
