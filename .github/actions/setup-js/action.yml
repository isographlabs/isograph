name: Setup JS
description: Install Node and pnpm from mise.toml, then install workspace dependencies.

inputs:
  install-args:
    description: Arguments passed to pnpm install
    required: false
    default: --frozen-lockfile --ignore-scripts

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v3
      with:
        install_args: node pnpm
    - name: Install dependencies
      run: pnpm install ${{ inputs.install-args }}
      shell: bash
