[package]
name = "isograph_cli"
version = "0.5.3"
edition = "2024"
license = "MIT"

# Excluded from the root workspace so this crate resolves its own lockfile: freddie_cli
# requires serde >= 1.0.229, and swc_common 2.0.1 does not compile against serde >= 1.0.229.
[workspace]

[[bin]]
name = "isograph"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.18", features = ["derive"] }
freddie_cli = { git = "https://github.com/freddiehg/freddie", rev = "270594ab956c7605ad84ae592443e3a460ae01be" }
prelude = { path = "../prelude" }
tracing = "0.1.41"

[dev-dependencies]
prelude = { path = "../prelude" }
tempfile = "3"

[lints.clippy]
allow_attributes = "deny"
print_stderr = "deny"
print_stdout = "deny"
explicit_deref_methods = "deny"
explicit_into_iter_loop = "deny"
match_wild_err_arm = "deny"
unnecessary_join = "deny"
unused_self = "deny"
needless_for_each = "deny"
struct_field_names = "deny"
cast_precision_loss = "deny"
match_bool = "deny"
items_after_statements = "deny"
single_char_pattern = "deny"
