fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: ./scripts/check-rustfmt.sh
        language: system
        types: [rust]
        pass_filenames: false
      # cargo-clippy and cargo-test read the commit range themselves, deletions
      # included, so they run on every commit and pick the crates to check.
      - id: cargo-clippy
        name: cargo clippy
        entry: ./scripts/cargo-affected.sh clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      # Clippy cannot ban Ok/Err/Some constructors; this is the enforcement.
      - id: postfix-constructors
        name: postfix constructors
        entry: cargo test -p prelude --lib postfix_constructors
        language: system
        files: '\.(rs|md)$'
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --experimental-cli --cache --config-path ./.prettierrc.json --check .
        language: system
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: pnpm run lint --deny-warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: ./scripts/cargo-affected.sh test
        language: system
        pass_filenames: false
        always_run: true
      - id: swc-plugin-fmt
        name: swc plugin cargo fmt
        entry: cargo fmt --manifest-path crates/swc_isograph_plugin/Cargo.toml -- --check
        language: system
        files: '^crates/swc_isograph_plugin/'
        pass_filenames: false
      - id: swc-plugin-clippy
        name: swc plugin cargo clippy
        entry: cargo clippy --manifest-path crates/swc_isograph_plugin/Cargo.toml --all-targets -- -D warnings
        language: system
        files: '^crates/swc_isograph_plugin/'
        pass_filenames: false
      - id: swc-plugin-test
        name: swc plugin cargo test
        entry: cargo test --manifest-path crates/swc_isograph_plugin/Cargo.toml
        language: system
        files: '^crates/swc_isograph_plugin/'
        pass_filenames: false
      - id: babel-plugin-test
        name: babel plugin test
        entry: pnpm --filter @isograph/babel-plugin test
        language: system
        files: '^libs/isograph-babel-plugin/'
        pass_filenames: false
      - id: babel-plugin-typecheck
        name: babel plugin typecheck
        entry: pnpm --filter @isograph/babel-plugin typecheck
        language: system
        files: '^libs/isograph-babel-plugin/'
        pass_filenames: false
      - id: precommit-in-worktree-test
        name: precommit-in-worktree-test
        entry: ./scripts/precommit-in-worktree-test.sh
        language: system
        pass_filenames: false
        always_run: true
