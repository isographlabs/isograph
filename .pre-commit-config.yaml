fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: ./scripts/check-rustfmt.sh
        language: system
        types: [rust]
        pass_filenames: false
      # Stricter than ci.yml's clippy job: any warning blocks the commit. pico is kept
      # from upstream unchanged, so its warnings are not ours to fix and it is excluded.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --exclude pico --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
